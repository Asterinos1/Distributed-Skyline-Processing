# Distributed Skyline Processing - Production Configurations

# Kafka Cluster Configurations
bootstrap-servers=kafka:29092
input-topic=input-tuples
query-topic=queries
output-topic=output-skyline
dlq-topic=input-tuples-dlq

# Schema Registry (internal Docker network address)
schema-registry-url=http://schema-registry:8081

# Skyline Processing Parameters
# Supported algorithms: mr-dim, mr-grid, mr-angle
algo=mr-angle
parallelism=4
domain=10000.0
dims=3

# Flink Checkpointing & Fault Tolerance
checkpointing.enabled=true
checkpointing.interval-ms=60000
checkpointing.min-pause-ms=30000
checkpointing.timeout-ms=600000

state.backend=rocksdb

# Event Time Windowing & State Management
window-size-ms=5000
watermark.idleness-sec=5
state.ttl-hours=2
