name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/production-upgrade ]
  pull_request:
    branches: [ main, feature/production-upgrade ]

jobs:
  # Job 1: Build and test the Java Flink Application
  java-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run Java Unit Tests
        run: mvn clean test

      - name: Build Runnable Shadow JAR
        run: mvn package -DskipTests

      - name: Upload Shaded JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlinkSkyline-ShadowJar
          path: target/Skyline-Project-Flink-*-shaded.jar
          retention-days: 7

  # Job 2: Test and lint the Python Generator Scripts
  python-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Run Python Linter
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 python/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 python/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Python Unit Tests
        run: pytest python/
